                {name: "Corn Pizza", price: 130, img: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500&auto=format&fit=crop&q=60"},
                {name: "Capsicam Pizza", price: 130, img: "https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=500&auto=format&fit=crop&q=60"},
                {name: "Paneer Pizza", price: 150, img: "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=500&auto=format&fit=crop&q=60"},
                {name: "Special Pizza", price: 170, img: "https://images.unsplash.com/photo-1590947132387-155cc02f3212?w=500&auto=format&fit=crop&q=60"}
            ],
            "Pasta & Fries": [
                {name: "Suji Pasta (Half)", price: 50, img: "https://images.unsplash.com/photo-1621996346565-e3d5d6281298?w=500&auto=format&fit=crop&q=60"},
                {name: "Suji Pasta (Full)", price: 90, img: "https://images.unsplash.com/photo-1621996346565-e3d5d6281298?w=500&auto=format&fit=crop&q=60"},
                {name: "Meda Pasta (Half)", price: 40, img: "https://images.unsplash.com/photo-1555949258-eb67b1ef0ceb?w=500&auto=format&fit=crop&q=60"},
                {name: "Meda Pasta (Full)", price: 80, img: "https://images.unsplash.com/photo-1555949258-eb67b1ef0ceb?w=500&auto=format&fit=crop&q=60"},
                {name: "French Fries (Half)", price: 40, img: "https://images.unsplash.com/photo-1576107232684-1279f3908591?w=500&auto=format&fit=crop&q=60"},
                {name: "French Fries (Full)", price: 70, img: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=500&auto=format&fit=crop&q=60"}
            ]
        };

        let cart = [];
        let userLocationCoords = "";

        function renderMenu() {
            const container = document.getElementById('menu-container');
            const navContainer = document.getElementById('categoryNav');
            let html = '';
            let navHtml = '';

            let first = true;
            for (let category in menuData) {
                let catId = category.replace(/[^a-zA-Z]/g, '');
                navHtml += `<button class="cat-tab ${first ? 'active' : ''}" onclick="scrollToCat('${catId}', this)">${category}</button>`;
                first = false;

                html += `<div class="category-section" id="cat_${catId}">`;
                html += `<div class="category-title">${category}</div>`;
                html += `<div class="menu-grid">`;

                menuData[category].forEach((item, index) => {
                    let priceDisplay = '';
                    let sizeSelectHtml = '';

                    if (item.sizes) {
                        let firstSize = Object.keys(item.sizes)[0];
                        priceDisplay = `₹<span id="price_${catId}_${index}">${item.sizes[firstSize]}</span>`;
                        sizeSelectHtml = `<select class="size-select" id="size_${catId}_${index}" onchange="updatePrice('${category}', ${index}, '${catId}')">`;
                        for (let size in item.sizes) {
                            sizeSelectHtml += `<option value="${size}">${size} (₹${item.sizes[size]})</option>`;
                        }
                        sizeSelectHtml += `</select>`;
                    } else {
                        priceDisplay = `₹${item.price}`;
                    }

                    html += `
                        <div class="menu-card">
                            <div class="item-img-container">
                                <img src="${item.img}" alt="${item.name}" loading="lazy">
                            </div>
                            <div class="item-details">
                                <div class="item-info">
                                    <h3>${item.name}</h3>
                                    <div class="item-price" id="display_price_${catId}_${index}">${priceDisplay}</div>
                                </div>
                                <div class="item-actions">
                                    ${sizeSelectHtml}
                                    <button class="add-btn" onclick="addToCart('${category}', ${index}, '${catId}')">Add +</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += `</div></div>`;
            }
            navContainer.innerHTML = navHtml;
            container.innerHTML = html;
        }

        function scrollToCat(catId, btn) {
            document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            const element = document.getElementById(`cat_${catId}`);
            element.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function updatePrice(category, index, catId) {
            const item = menuData[category][index];
            const select = document.getElementById(`size_${catId}_${index}`);
            const selectedSize = select.value;
            const priceDisplay = document.getElementById(`display_price_${catId}_${index}`);
            priceDisplay.innerHTML = `₹${item.sizes[selectedSize]}`;
        }

        function addToCart(category, index, catId) {
            const item = menuData[category][index];
            let name = item.name;
            let price = item.price;
            let size = '';

            if (item.sizes) {
                const select = document.getElementById(`size_${catId}_${index}`);
                size = select.value;
                price = item.sizes[size];
                name += ` (${size})`;
            }

            const existing = cart.find(cartItem => cartItem.name === name);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ name, price, qty: 1 });
            }
            updateCartUI();
        }

        function changeQty(index, delta) {
            cart[index].qty += delta;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            updateCartUI();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function updateCartUI() {
            const cartBar = document.getElementById('cartBar');
            const cartSummaryText = document.getElementById('cartSummaryText');
            const cartItemsPreview = document.getElementById('cartItemsPreview');

            let totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            let totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            if (totalItems > 0) {
                cartBar.style.display = 'flex';
                cartSummaryText.innerText = `${totalItems} Items | Total: ₹${totalPrice}`;
                
                let previewHtml = '';
                cart.forEach((item, index) => {
                    previewHtml += `
                        <div class="cart-mini-row">
                            <span><b>${item.name}</b> (₹${item.price * item.qty})</span>
                            <div class="mini-controls">
                                <button class="mini-qty-btn" onclick="changeQty(${index}, -1)">-</button>
                                <span style="font-size: 12px; font-weight: bold;">${item.qty}</span>
                                <button class="mini-qty-btn" onclick="changeQty(${index}, 1)">+</button>
                                <button class="mini-del-btn" onclick="removeFromCart(${index})" title="Remove"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                });
                cartItemsPreview.innerHTML = previewHtml;
            } else {
                cartBar.style.display = 'none';
                closeCheckoutModal();
            }
        }

        function openCheckoutModal() {
            if (cart.length === 0) return;
            document.getElementById('checkoutModal').style.display = 'flex';
        }

        function closeCheckoutModal() {
            document.getElementById('checkoutModal').style.display = 'none';
        }

        function getLocation() {
            const status = document.getElementById('locStatus');
            if (!navigator.geolocation) {
                status.innerText = "Geolocation supported nahi hai";
                return;
            }
            status.innerText = "Fetching location...";
            navigator.geolocation.getCurrentPosition((position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                userLocationCoords = `https://maps.google.com/?q=${lat},${lon}`;
                status.innerText = "Location added! ✅";
            }, () => {
                status.innerText = "Location fetch nahi ho payi";
            });
        }

        function sendWhatsAppOrder() {
            const name = document.getElementById('customerName').value.trim();
            const phone = document.getElementById('customerPhone').value.trim();
            const paymentRef = document.getElementById('paymentRef').value.trim();
            const address = document.getElementById('customerAddress').value.trim();
            const proofInput = document.getElementById('paymentProofInput');

            if (!name) {
                alert("Kripya apna naam darj karein!");
                return;
            }
            if (!phone) {
                alert("Kripya apna mobile number darj karein!");
                return;
            }
            if (!paymentRef) {
                alert("Kripya payment karne ke baad Transaction ID / UTR Number darj karein!");
                return;
            }

            let orderText = `*Paid Order - UPSC Chaiwala / Musafir Cafe*%0A%0A`;
            orderText += `👤 *Name:* ${name}%0A`;
            orderText += `📱 *Phone Number:* ${phone}%0A`;
            orderText += `💳 *Transaction ID/UTR:* ${paymentRef}%0A`;
            if (proofInput.files && proofInput.files[0]) {
                orderText += `🖼️ *Payment Screenshot:* [Attached/Selected by Customer]%0A`;
            }
            orderText += `📍 *Address/Table:* ${address || 'Not Provided'}%0A`;
            if (userLocationCoords) {
                orderText += `🗺️ *Location Map:* ${userLocationCoords}%0A`;
            }
            orderText += `%0A🛍️ *Order Items:*%0A`;

            let grandTotal = 0;
            cart.forEach(item => {
                let itemTotal = item.price * item.qty;
                grandTotal += itemTotal;
                orderText += `- ${item.name} x ${item.qty} = ₹${itemTotal}%0A`;
            });

            orderText += `%0A💰 *Grand Total Paid:* *₹${grandTotal}*`;

            const whatsappUrl = `https://wa.me/${cafePhone}?text=${orderText}`;
            window.open(whatsappUrl, '_blank');
        }

        window.onload = renderMenu;
    </script>
</body>
</html>
