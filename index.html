<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musafir Cafe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #7a7a7a, #4a4a4a);
            color: #ffffff;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .phone {
            color: #ff4d4d;
        }

        .center-content {
            text-align: center;
        }

        .center-content h1 {
            font-size: 48px;
            letter-spacing: 3px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
            margin-bottom: 5px;
        }

        .center-content p {
            font-size: 16px;
            color: #f1c40f;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Top Section -->
    <div class="top-bar">
        <div>RIVERSIDE 35, JAIPUR</div>
        <div class="phone">📞 +91 9256466573</div>
    </div>

    <!-- Center Section -->
    <div class="center-content">
        <h1>MUSAFIR CAFE</h1>
        <p>AN UNUSUAL LOVE STORY</p>
    </div>

    <!-- Bottom Section -->
    <div class="bottom-bar">
        <div>महँगी सी इस दुनिया में, सुकून का एक सस्ता सा पता</div>
        <div>Mr. Prmod Saini</div>
    </div>

</body>
</html>
