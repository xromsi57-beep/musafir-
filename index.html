<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>91 Club — Member Login</title>
  <style>
    :root {
      --bg: #0f131d;
      --shell: #161c2a;
      --card: #1e2638;
      --input-bg: #252f45;
      --primary: #f95959;
      --primary-dark: #d93838;
      --accent: #ff9a44;
      --text: #f4f7fc;
      --muted: #96a2b8;
      --border: rgba(255, 255, 255, 0.08);
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    /* Mobile-first centered app shell */
    .app-shell {
      width: 100%;
      max-width: 430px;
      background: var(--shell);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
    }

    /* Top red gradient banner */
    .top-banner {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      padding: 18px 20px 28px;
      color: #fff;
      border-bottom-left-radius: 22px;
      border-bottom-right-radius: 22px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .back-link {
      color: #fff;
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 600;
      opacity: 0.92;
    }

    .brand-pill {
      background: rgba(0, 0, 0, 0.22);
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
    }

    .top-banner h1 {
      font-size: 1.45rem;
      margin-bottom: 4px;
    }

    .top-banner p {
      font-size: 0.84rem;
      opacity: 0.9;
    }

    /* Mode Tabs */
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin: -14px 20px 0;
      background: var(--card);
      border-radius: 12px;
      padding: 4px;
      border: 1px solid var(--border);
    }

    .tab-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 10px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
    }

    /* Form Area */
    .form-wrap {
      padding: 22px 20px 32px;
      flex: 1;
    }

    .field-group {
      margin-bottom: 16px;
    }

    .field-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }

    .input-row {
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 11px;
      overflow: hidden;
    }

    .input-row:focus-within {
      border-color: var(--primary);
    }

    .country-select {
      background: transparent;
      color: var(--text);
      border: none;
      border-right: 1px solid var(--border);
      padding: 13px 10px;
      font-weight: 600;
      font-size: 0.92rem;
      outline: none;
    }

    .country-select option {
      background: var(--card);
      color: var(--text);
    }

    .text-input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 13px 14px;
      font-size: 0.95rem;
      outline: none;
    }

    .toggle-pass {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 0 14px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.84rem;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
    }

    .checkbox-label input {
      accent-color: var(--primary);
      width: 15px;
      height: 15px;
    }

    .link-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 13px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(249, 89, 89, 0.3);
      margin-bottom: 12px;
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .btn-secondary {
      width: 100%;
      border: 1px solid var(--primary);
      border-radius: 999px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
      background: transparent;
      cursor: pointer;
    }

    .status-box {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.86rem;
      display: none;
    }

    .status-box.error {
      display: block;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .status-box.success {
      display: block;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }

    /* Quick bottom links */
    .quick-footer {
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .support-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
      cursor: pointer;
    }

    .support-card strong {
      display: block;
      color: var(--text);
      margin-bottom: 2px;
      font-size: 0.88rem;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="top-banner">
      <div class="top-bar">
        <a href="index.html" class="back-link">&larr; Home</a>
        <span class="brand-pill">91 CLUB</span>
      </div>
      <h1 id="bannerHeading">Log in</h1>
      <p id="bannerSub">Sign in with your phone number and password</p>
    </div>

    <div class="tabs">
      <button type="button" class="tab-btn active" id="tabLogin" onclick="switchMode('login')">Phone Login</button>
      <button type="button" class="tab-btn" id="tabRegister" onclick="switchMode('register')">Register</button>
    </div>

    <div class="form-wrap">
      <form id="authForm" onsubmit="submitForm(event)">
        <div class="field-group">
          <label class="field-label" for="phoneInput">Phone Number</label>
          <div class="input-row">
            <select class="country-select" id="countryCode" aria-label="Country code">
              <option value="+91">+91</option>
              <option value="+1">+1</option>
              <option value="+44">+44</option>
              <option value="+971">+971</option>
            </select>
            <input
              class="text-input"
              id="phoneInput"
              type="tel"
              inputmode="numeric"
              placeholder="Enter phone number"
              required
            />
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="passwordInput">Password</label>
          <div class="input-row">
            <input
              class="text-input"
              id="passwordInput"
              type="password"
              placeholder="Enter password (min 6 chars)"
              required
            />
            <button type="button" class="toggle-pass" onclick="togglePassword('passwordInput', this)">Show</button>
          </div>
        </div>

        <!-- Register-only fields -->
        <div id="registerFields" class="hidden">
          <div class="field-group">
            <label class="field-label" for="confirmInput">Confirm Password</label>
            <div class="input-row">
              <input
                class="text-input"
                id="confirmInput"
                type="password"
                placeholder="Re-enter password"
              />
              <button type="button" class="toggle-pass" onclick="togglePassword('confirmInput', this)">Show</button>
            </div>
          </div>

          <div class="field-group">
            <label class="field-label" for="inviteInput">Invite Code (Optional)</label>
            <div class="input-row">
              <input
                class="text-input"
                id="inviteInput"
                type="text"
                placeholder="Enter referral code if available"
              />
            </div>
          </div>
        </div>

        <div class="options-row">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberCheck" checked />
            <span id="checkText">Remember password</span>
          </label>
          <button type="button" class="link-btn" onclick="showResetHint()">Forgot password?</button>
        </div>

        <button type="submit" class="btn-submit" id="primaryBtn">Log in</button>
        <button type="button" class="btn-secondary" id="secondaryBtn" onclick="toggleMode()">Register</button>

        <div class="status-box" id="statusBox"></div>
      </form>

      <div class="quick-footer">
        <div class="support-card" onclick="showResetHint()">
          <strong>Forgot Password</strong>
          Reset via phone verification
        </div>
        <div class="support-card" onclick="showSupportHint()">
          <strong>24/7 Support</strong>
          Customer service center
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentMode = "login";

    function switchMode(mode) {
      currentMode = mode;
      const isLogin = mode === "login";

      document.getElementById("tabLogin").classList.toggle("active", isLogin);
      document.getElementById("tabRegister").classList.toggle("active", !isLogin);
      document.getElementById("registerFields").classList.toggle("hidden", isLogin);

      document.getElementById("bannerHeading").textContent = isLogin ? "Log in" : "Register";
      document.getElementById("bannerSub").textContent = isLogin
        ? "Sign in with your phone number and password"
        : "Create a new member account with your phone number";

      document.getElementById("checkText").textContent = isLogin
        ? "Remember password"
        : "I agree to the User Agreement";

      document.getElementById("primaryBtn").textContent = isLogin ? "Log in" : "Register";
      document.getElementById("secondaryBtn").textContent = isLogin ? "Register" : "Back to Log in";
      clearStatus();
    }

    function toggleMode() {
      switchMode(currentMode === "login" ? "register" : "login");
    }

    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const isHidden = input.type === "password";
      input.type = isHidden ? "text" : "password";
      btn.textContent = isHidden ? "Hide" : "Show";
    }

    function setStatus(message, type) {
      const box = document.getElementById("statusBox");
      box.textContent = message;
      box.className = `status-box ${type}`;
    }

    function clearStatus() {
      const box = document.getElementById("statusBox");
      box.className = "status-box";
      box.textContent = "";
    }

    function submitForm(event) {
      event.preventDefault();
      const code = document.getElementById("countryCode").value;
      const phone = document.getElementById("phoneInput").value.trim().replace(/\s+/g, "");
      const pass = document.getElementById("passwordInput").value;

      if (!/^\d{7,15}$/.test(phone)) {
        setStatus("Enter a valid numeric phone number (7–15 digits).", "error");
        return;
      }

      if (pass.length < 6) {
        setStatus("Password must be at least 6 characters long.", "error");
        return;
      }

      if (currentMode === "register") {
        const confirmPass = document.getElementById("confirmInput").value;
        const agreed = document.getElementById("rememberCheck").checked;
        if (pass !== confirmPass) {
          setStatus("Passwords do not match.", "error");
          return;
        }
        if (!agreed) {
          setStatus("Please agree to the User Agreement to continue.", "error");
          return;
        }
        setStatus(`Demo registration complete for ${code} ${phone}.`, "success");
      } else {
        setStatus(`Demo login validated for ${code} ${phone}. Redirecting to portal...`, "success");
      }
    }

    function showResetHint() {
      setStatus("Password reset requires backend OTP verification in production.", "success");
    }

    function showSupportHint() {
      setStatus("Connect this card to your live-chat widget or support ticket URL.", "success");
    }
  </script>
</body>
</html>
